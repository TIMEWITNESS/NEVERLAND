<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>Paulis Cosmos · X42 · Neo Hsmburg</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff9ecf;--lav:#c9a7ff;--aqua:#7ee8fa;--gold:#ffd98e;--mint:#9ae6b4;--red:#e0245e;
  --theme:#7ee8fa;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#05040b;color:#f4f1ff;
  font-family:Quicksand,system-ui;overscroll-behavior:none;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}

/* ── sparkles ─────────────────────────────────────────── */
#sparkles{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#sparkles span{position:absolute;color:#fff;text-shadow:0 0 6px var(--aqua),0 0 12px var(--lav);
  animation:tw 3s ease-in-out infinite,dr 22s linear infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes dr{from{translate:0 0}to{translate:-40px -50px}}

/* ── fullscreen canvas ────────────────────────────────── */
#cosmos{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ── field overlay: stickers, pets, gods, threads ──────── */
#field{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

.sticker{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;
  transition:box-shadow .2s,filter .25s}
.sticker.text{font-size:38px;line-height:1;
  filter:drop-shadow(0 0 12px var(--theme))}
.sticker.img{width:76px;height:76px;border-radius:50%;overflow:hidden;
  border:2px solid rgba(255,255,255,.5);
  box-shadow:0 0 16px var(--theme),inset 0 0 18px rgba(255,255,255,.15)}
.sticker.img img{width:100%;height:100%;object-fit:cover}
.sticker.sel{box-shadow:0 0 0 3px #fff,0 0 24px var(--theme)}
.sticker.inactive.img{filter:invert(1) hue-rotate(180deg)}
.sticker.elec{animation:elec .14s linear infinite}
@keyframes elec{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* sparkle particles on pop */
.pop-g{position:absolute;pointer-events:none;font-size:15px;z-index:8;
  animation:popG .8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes popG{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(var(--rot))}}

/* pets */
.pet{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;
  filter:drop-shadow(0 0 10px rgba(168,85,247,.75));z-index:7}
.pet svg{width:100%;height:100%;overflow:visible}
.pet .aura{animation:ap 4.4s ease-in-out infinite;transform-origin:center}
@keyframes ap{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.1)}}
.pet .tail{transform-origin:76% 62%;animation:tw1 3.6s ease-in-out infinite}
@keyframes tw1{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
.pet .eye{animation:bl 5.8s infinite;transform-origin:center}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.pet.sel{filter:drop-shadow(0 0 14px var(--red)) drop-shadow(0 0 24px var(--red))}

/* stars inside cats */
.cat-star{position:absolute;width:18px;height:18px;cursor:pointer;pointer-events:auto;
  touch-action:manipulation;z-index:9;transition:transform .2s;
  filter:drop-shadow(0 0 6px var(--gold))}
.cat-star:active{transform:scale(.8) rotate(72deg)}
.cat-star svg{width:100%;height:100%;fill:var(--gold)}
.cat-star.chosen{animation:starPulse 1.2s ease-in-out infinite}
@keyframes starPulse{0%,100%{filter:drop-shadow(0 0 6px var(--gold))}
  50%{filter:drop-shadow(0 0 14px var(--red)) drop-shadow(0 0 20px var(--gold))}}

/* gods float */
.god-f{position:absolute;width:44px;height:44px;cursor:pointer;pointer-events:auto;
  touch-action:manipulation;z-index:8;transition:transform .2s;
  filter:drop-shadow(0 0 8px var(--gc,#c9a7ff))}
.god-f:active{transform:scale(.88)}
.god-f svg{width:100%;height:100%}
.god-f .lbl{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
  font-size:5.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;white-space:nowrap;text-shadow:0 0 5px var(--gc,#c9a7ff);pointer-events:none}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-8px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,6px)}}

/* rabbit */
#rabbit{width:44px;height:44px;position:absolute;pointer-events:auto;cursor:pointer;
  touch-action:manipulation;z-index:9;filter:drop-shadow(0 0 8px var(--pink))}
#rabbit svg{width:100%;height:100%}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#rabbit.hop{animation:hop .8s ease-in-out infinite}

/* magnifier — no page zoom, this simulates zoom */
#mag{position:fixed;width:130px;height:130px;border-radius:50%;z-index:50;
  pointer-events:none;display:none;overflow:hidden;
  border:2px solid var(--gold);box-shadow:0 0 24px var(--gold),inset 0 0 20px rgba(255,217,142,.3)}
#mag.on{display:block}
#mag canvas{position:absolute;width:1000px;height:1000px;
  transform-origin:0 0;image-rendering:pixelated}
#mag .lupe{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.05) 40%,rgba(255,217,142,.15) 80%,transparent)}

/* ── letter (bottom sheet = HUD background) ─────────────── */
#letter{position:fixed;left:0;right:0;bottom:0;z-index:12;
  height:40vh;background:linear-gradient(150deg,rgba(168,85,247,.20),rgba(126,232,250,.06));
  border-top:1.5px solid rgba(201,167,255,.45);
  box-shadow:inset 0 20px 40px rgba(168,85,247,.10);
  transition:height .4s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
  touch-action:pan-y}
#letter::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent 0 20px,rgba(168,85,247,.10) 20px 21px),
    repeating-linear-gradient(90deg,transparent 0 20px,rgba(126,232,250,.07) 20px 21px);
  opacity:.5}
#letter.expanded{height:100vh;padding-top:env(safe-area-inset-top)}

#timeline{position:relative;flex-shrink:0;padding:6px 10px 4px;
  display:flex;align-items:center;gap:6px;z-index:1;
  background:linear-gradient(180deg,rgba(10,6,20,.5),transparent)}
#timeline .btn-tl{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--aqua),var(--lav));
  color:#0b0616;display:grid;place-items:center;font-size:11px;
  pointer-events:auto;touch-action:manipulation;flex-shrink:0;font-weight:700}
#timeline .scrub-wrap{flex:1;position:relative;height:20px}
#timeline #scrubber{width:100%;height:5px;-webkit-appearance:none;appearance:none;
  background:rgba(255,255,255,.15);border-radius:5px;position:absolute;top:8px;
  pointer-events:auto;cursor:pointer}
#timeline #scrubber::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);cursor:pointer}
#kf-dots{position:absolute;top:2px;left:0;right:0;height:16px;pointer-events:none}
.kf-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;
  border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);
  pointer-events:auto;cursor:pointer}
.kf-dot.sel{background:var(--red);box-shadow:0 0 10px var(--red);transform:translate(-50%,-50%) scale(1.3)}

#letterText{flex:1;width:100%;background:transparent;border:0;outline:none;resize:none;
  color:#fff;font-family:Quicksand;font-size:14px;line-height:1.55;
  padding:10px 16px;position:relative;z-index:1;pointer-events:auto;touch-action:pan-y}
#letterText::placeholder{color:rgba(201,167,255,.55)}

#letter-actions{position:relative;z-index:1;padding:0 10px 6px;display:flex;gap:4px;
  flex-wrap:wrap;flex-shrink:0}
.lt-b{padding:5px 8px;border-radius:8px;font-size:9px;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:#fff;pointer-events:auto;touch-action:manipulation;
  display:inline-flex;align-items:center;gap:3px;
  transition:transform .15s,background .15s}
.lt-b:active{transform:scale(.94);background:rgba(255,255,255,.18)}
.lt-b.primary{background:linear-gradient(120deg,var(--lav),var(--pink));color:#0b0616;
  border-color:transparent}

/* ── HUD strip (no bg, floating over letter) ───────────── */
#hud{position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:0 4px calc(4px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:4px;
  background:linear-gradient(0deg,rgba(7,6,15,.92) 0%,rgba(7,6,15,.6) 60%,transparent 100%);
  pointer-events:none}
.hud-row{display:flex;justify-content:center;gap:3px;pointer-events:auto}
.hud-b{width:42px;height:42px;border-radius:11px;cursor:pointer;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(15,10,26,.85);border:1px solid rgba(255,255,255,.16);
  color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;
  pointer-events:auto;touch-action:manipulation;position:relative;
  transition:transform .15s,background .15s,border-color .15s;
  font-family:Quicksand}
.hud-b:active{transform:scale(.9)}
.hud-b.active{background:rgba(255,217,142,.22);border-color:var(--gold)}
.hud-b .ic{font-size:16px;line-height:1;pointer-events:none}
.hud-b .nm{font-size:6px;opacity:.65;margin-top:1px;letter-spacing:.05em;
  text-transform:uppercase;pointer-events:none;font-weight:800}
.hud-b .dot{position:absolute;top:2px;right:3px;width:7px;height:7px;border-radius:50%;
  background:var(--red);box-shadow:0 0 6px var(--red);display:none}
.hud-b.has-new .dot{display:block;animation:pu 1.2s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(44vh + 12px);transform:translate(-50%,12px);
  z-index:60;padding:8px 16px;border-radius:99px;font-weight:700;font-size:11.5px;
  color:#0b0616;background:linear-gradient(120deg,var(--aqua),var(--lav),var(--pink));
  opacity:0;pointer-events:none;transition:opacity .24s,transform .24s;
  max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* says bubble */
.says{position:fixed;z-index:65;max-width:220px;padding:9px 13px;
  border-radius:14px 14px 14px 3px;
  background:linear-gradient(150deg,var(--lav),var(--pink));
  color:#10061e;font-weight:700;font-size:11.5px;line-height:1.4;
  box-shadow:0 6px 20px rgba(168,85,247,.4);
  animation:pop .28s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}

/* webcam modal */
#webcam{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:16px;
  background:rgba(4,3,10,.9);backdrop-filter:blur(6px)}
#webcam.on{display:grid}
.wm{background:rgba(26,20,44,.98);border:1px solid rgba(255,255,255,.22);
  border-radius:16px;padding:10px;width:100%;max-width:340px;position:relative;
  display:flex;flex-direction:column;gap:8px}
.wm video{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;
  background:#000;transform:scaleX(-1)}
.wm .close{position:absolute;top:-8px;right:-8px;width:26px;height:26px;
  border-radius:50%;background:#e0245e;color:#fff;border:1px solid #fff;
  display:grid;place-items:center;cursor:pointer;font-size:11px;
  pointer-events:auto}
.wm button.cap{padding:9px;border-radius:10px;cursor:pointer;
  background:linear-gradient(120deg,var(--aqua),var(--lav));
  color:#0b0616;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:11px;border:0;pointer-events:auto}

/* narrator settings */
#narrator-p{position:fixed;left:50%;bottom:calc(44vh + 8px);transform:translateX(-50%);
  z-index:55;padding:8px 10px;border-radius:12px;
  background:rgba(26,20,44,.95);border:1px solid rgba(255,255,255,.2);
  display:none;flex-direction:column;gap:4px;min-width:220px;max-width:92vw}
#narrator-p.on{display:flex}
#narrator-p .head{font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;color:var(--gold);text-align:center;margin-bottom:2px}
#narrator-p button{padding:6px 8px;border-radius:8px;cursor:pointer;font-size:10.5px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  color:#fff;text-align:left;display:flex;align-items:center;gap:6px;
  pointer-events:auto;font-family:Quicksand;font-weight:600}
#narrator-p button.on{background:rgba(255,217,142,.2);border-color:var(--gold)}

/* spoiler text */
.spoiler{display:inline-block;background:#0b0616;color:transparent;
  border-radius:3px;padding:0 3px;cursor:pointer;transition:all .3s;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.spoiler.revealed{background:transparent;color:inherit;box-shadow:none}
.spoiler.analyzed{background:#fb923c;color:#0b0616;font-weight:700}

/* general helper */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>

<div id="sparkles"></div>
<canvas id="cosmos"></canvas>

<!-- field overlay -->
<svg id="threads" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
<div id="field"></div>

<!-- magnifier -->
<div id="mag"><div class="lupe"></div></div>

<!-- letter bottom sheet -->
<div id="letter">
  <div id="timeline">
    <button class="btn-tl" onclick="Timeline.play()" id="tl-play">▶</button>
    <div class="scrub-wrap">
      <div id="kf-dots"></div>
      <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1">
    </div>
    <button class="btn-tl" onclick="Timeline.addKF()" title="Add keyframe">✦</button>
    <button class="btn-tl" onclick="Timeline.clear()" title="Clear">✕</button>
  </div>
  <textarea id="letterText" placeholder="Write your E-Letter to the cosmos… (tap ✦ in timeline to pin a moment)"></textarea>
  <div id="letter-actions">
    <button class="lt-b" onclick="Letter.save('txt')">📄 .txt</button>
    <button class="lt-b" onclick="Letter.save('html')">🌐 .html</button>
    <button class="lt-b" onclick="Letter.save('pdf')">📕 PDF</button>
    <button class="lt-b" onclick="Letter.save('zip')">🔒 PW</button>
    <button class="lt-b primary" onclick="Letter.toggleExpand()" id="lt-expand">⛶ Expand</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-row">
    <div class="hud-b" onclick="pickFile('music')"><span class="ic">🎵</span><span class="nm">Music</span></div>
    <div class="hud-b" onclick="pickFile('stories')"><span class="ic">📖</span><span class="nm">Story</span></div>
    <div class="hud-b" onclick="pickFile('pictures')"><span class="ic">🖼</span><span class="nm">Pic</span></div>
    <div class="hud-b" onclick="pickFile('videos')"><span class="ic">🎬</span><span class="nm">Video</span></div>
    <div class="hud-b" onclick="pickFile('web')"><span class="ic">🌐</span><span class="nm">Web</span></div>
    <div class="hud-b" onclick="pickFile('models')"><span class="ic">🧊</span><span class="nm">3D</span></div>
    <div class="hud-b" onclick="pickFile('files')"><span class="ic">📦</span><span class="nm">Any</span></div>
    <div class="hud-b" onclick="toggleWebcam()"><span class="ic">📷</span><span class="nm">Cam</span></div>
  </div>
  <div class="hud-row">
    <div class="hud-b" id="h-joy" onclick="Tool.toggle('joy')"><span class="ic">🕹</span><span class="nm">Joy</span></div>
    <div class="hud-b" id="h-pop" onclick="Tool.toggle('pop')"><span class="ic">✋</span><span class="nm">Pop</span></div>
    <div class="hud-b" id="h-del" onclick="Tool.toggle('del')"><span class="ic">✂</span><span class="nm">Delete</span></div>
    <div class="hud-b" onclick="Snap.run()"><span class="ic">📸</span><span class="nm">Snap</span></div>
    <div class="hud-b" onclick="Narrator.togglePanel()"><span class="ic">🗣</span><span class="nm">Talk</span></div>
    <div class="hud-b" onclick="Rabbit.toggleMag()"><span class="ic">🐇</span><span class="nm">Lupe</span></div>
    <div class="hud-b" onclick="exportSticker()"><span class="ic">⬇</span><span class="nm">Export</span></div>
    <div class="hud-b" id="h-world" onclick="Worlds.next()"><span class="ic">✨</span><span class="nm">World</span></div>
  </div>
</div>

<!-- narrator panel -->
<div id="narrator-p">
  <div class="head">Narrator</div>
  <button id="narr-voice" onclick="Narrator.pickVoice()">🎙 Pick voice</button>
  <button id="narr-read" onclick="Narrator.readLetter()">📖 Read letter aloud</button>
  <button id="narr-hover" onclick="Narrator.toggleHover()">👆 Narrate taps</button>
  <button id="narr-stop" onclick="Narrator.stop()">⏹ Stop</button>
</div>

<!-- webcam -->
<div id="webcam">
  <div class="wm">
    <button class="close" onclick="toggleWebcam()">✕</button>
    <video id="webcam-video" autoplay playsinline></video>
    <button class="cap" onclick="captureWebcam()">📸 Snap & Add to canvas</button>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" class="sr-only" multiple>

<script>
/* ══════════════════════════════════════════════════════════════════════
   PAULIS COSMOS · v5 · Fullscreen canvas · Nokia-HUD · Timeline
   ══════════════════════════════════════════════════════════════════════ */

const S = {
  scene:'space', theme:'#7ee8fa', cipher:'norbinny',
  stickers:[], vault:[], keyframes:[], playhead:0, tlPlaying:false,
  playerChar:null, tool:null, world:'space'
};

/* ── sparkles ─────────────────────────────────────────── */
(function(){
  const S_=['✦','✧','⋆','✫','✬','✭','✮','✯'];
  const host=document.getElementById('sparkles');
  let h=''; const N=window.innerWidth<520?20:32;
  for(let i=0;i<N;i++){
    h+=`<span style="left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${8+Math.random()*8}px;animation-delay:${(Math.random()*6).toFixed(2)}s,${(Math.random()*6).toFixed(2)}s;animation-duration:${(2.4+Math.random()*3).toFixed(2)}s,${(18+Math.random()*18)|0}s">${S_[Math.random()*S_.length|0]}</span>`;
  }
  host.innerHTML=h;
})();

/* ── canvas cosmos (ABCMIXCATS core) ─────────────────── */
const canvas=document.getElementById('cosmos');
const ctx=canvas.getContext('2d');
let cw,ch,audioData=new Uint8Array(64),particles=[],rainbows=[];
function resize(){
  cw=canvas.width=innerWidth;
  ch=canvas.height=innerHeight;
  initParts();
}
function initParts(){
  particles=[];
  const n = S.scene==='cyber'?100 : S.scene==='ocean'?36 : 60;
  for(let i=0;i<n;i++) particles.push({
    x:Math.random()*cw, y:Math.random()*ch,
    r:Math.random()*2+.4,
    vy:(Math.random()*.55+.15)*(S.scene==='fire'?-1:1),
    vx:(Math.random()-.5)*.3,
    a:Math.random()*.6+.3, ph:Math.random()*Math.PI*2
  });
}

/* ── audio engine ─────────────────────────────────────── */
let audioCtx,audioEl,srcNode,gainN,filterN,delayN,fbN,analyser;
let isReady=false,isPlaying=false;
function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  audioCtx=new AC(); audioCtx.resume();
  audioEl=new Audio(); audioEl.crossOrigin='anonymous';
  analyser=audioCtx.createAnalyser(); analyser.fftSize=128;
  gainN=audioCtx.createGain();
  filterN=audioCtx.createBiquadFilter();
  delayN=audioCtx.createDelay(5);
  fbN=audioCtx.createGain();
  srcNode=audioCtx.createMediaElementSource(audioEl);
  srcNode.connect(filterN); filterN.connect(gainN);
  filterN.connect(delayN); delayN.connect(fbN); fbN.connect(delayN);
  delayN.connect(gainN); gainN.connect(analyser); analyser.connect(audioCtx.destination);
  audioEl.addEventListener('timeupdate',()=>{
    if(!audioEl.duration)return;
    const p=(audioEl.currentTime/audioEl.duration)*100;
    const sc=document.getElementById('scrubber');
    if(sc) sc.value=p;
  });
  audioEl.addEventListener('ended',()=>{
    const ic=document.getElementById('tl-play'); if(ic) ic.textContent='▶';
  });
  applyCipher('norbinny');
}
function loadMedia(url,name){
  if(!audioEl)return;
  audioEl.src=url; audioEl.load();
  toast('♪ '+(name||'audio').slice(0,32));
}
function togglePlay(){
  if(!audioEl||!audioEl.src){toast('Load media first');return;}
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(audioEl.paused){
    audioEl.play().then(()=>{
      document.getElementById('tl-play').textContent='⏸';
      isPlaying=true;
    }).catch(()=>toast('Blocked'));
  } else {
    audioEl.pause();
    document.getElementById('tl-play').textContent='▶';
    isPlaying=false;
  }
}
function applyCipher(type){
  S.cipher=type;
  if(!filterN)return;
  const t=audioCtx.currentTime;
  const P={
    norbinny:{t:'peaking',f:1500,q:1,d:.3,fb:.3},
    forest:{t:'lowpass',f:400,q:5,d:.6,fb:.5},
    celestial:{t:'highpass',f:3000,q:2,d:.15,fb:.7},
    majesties:{t:'peaking',f:1000,q:2,d:.75,fb:.6},
    ape:{t:'bandpass',f:800,q:4,d:.05,fb:.8},
    dragon:{t:'lowshelf',f:200,q:1,d:1,fb:.4}
  }[type];
  if(!P)return;
  filterN.type=P.t; filterN.frequency.value=P.f; filterN.Q.value=P.q;
  delayN.delayTime.setTargetAtTime(P.d,t,.1);
  fbN.gain.setTargetAtTime(P.fb,t,.1);
}

/* ── file upload (FIXED: sr-only, click) ─────────────── */
const ACCEPTS={
  music:'audio/*', stories:'.txt,.md,.pdf,.doc,.docx',
  pictures:'image/*,.heic,.heif,.avif', videos:'video/*',
  web:'.html,.htm,.url,.webloc', models:'.glb,.gltf',
  text:'.txt,.md,.json,.csv,.log', files:'*/*'
};
function pickFile(cat){
  const inp=document.getElementById('fileInput');
  inp.accept=ACCEPTS[cat]||'*/*';
  inp.value='';
  inp.onchange=async e=>{
    const files=e.target.files;
    if(!files||!files.length)return;
    toast(`Adding ${files.length}…`);
    for(const f of files) await ingest(f);
    Vault.markNew();
  };
  inp.click();
}
async function ingest(file){
  const mime=file.type||'', name=file.name||'untitled';
  const ext=(name.split('.').pop()||'').toLowerCase();
  const url=URL.createObjectURL(file);
  let type='file', text='';
  try{
    if(mime.startsWith('image/')||['png','jpg','jpeg','webp','gif','svg','avif','heic','heif'].includes(ext)) type='image';
    else if(mime.startsWith('video/')||['mp4','mov','m4v','webm','ogv','avi','mkv'].includes(ext)) type='video';
    else if(mime.startsWith('audio/')||['mp3','m4a','wav','ogg','flac','aac','opus'].includes(ext)) type='audio';
    else if(mime==='application/pdf'||ext==='pdf') type='pdf';
    else if(['glb','gltf'].includes(ext)) type='model';
    else if(['html','htm','url','webloc'].includes(ext)||mime==='text/html') type='web';
    else if(mime.startsWith('text/')||['txt','md','json','csv','log','rtf'].includes(ext)){
      type='note'; text=(await file.text()).slice(0,5000);
    }
  }catch(e){}
  S.vault.push({type,name,url,mime,text,raw:file});
  spawnStickerFromVault({type,name,url,text});
  paper('save');
}
function spawnStickerFromVault(item){
  const el=document.createElement('div');
  el.className='sticker';
  if(item.type==='image'){
    el.classList.add('img');
    el.innerHTML=`<img src="${item.url}">`;
  } else {
    el.classList.add('text');
    const gl={audio:'🎵',video:'🎬',pdf:'📕',web:'🌐',model:'🧊',note:'📜'}[item.type]||'📦';
    el.textContent=gl;
  }
  const x=100+Math.random()*(innerWidth-200);
  const y=100+Math.random()*(innerHeight*0.5-100);
  el.style.left=x+'px'; el.style.top=y+'px';
  el.dataset.x=x; el.dataset.y=y;
  document.getElementById('field').appendChild(el);
  const obj={
    id:'s'+Date.now()+Math.random(), el, type:item.type, name:item.name,
    x, y, url:item.url, text:item.text
  };
  S.stickers.push(obj);
  attachStickerEvents(obj);
  if(item.type==='audio' && item.url) loadMedia(item.url,item.name);
  toast('Added ✦');
  paper('pop');
}
function attachStickerEvents(obj){
  const el=obj.el;
  let ox=0,oy=0,drag=false,moved=0,sx=0,sy=0;
  el.addEventListener('pointerdown',e=>{
    if(S.tool){ handleToolHit(obj,e); return; }
    e.preventDefault(); e.stopPropagation();
    drag=true; moved=0;
    sx=e.clientX; sy=e.clientY;
    ox=e.clientX-obj.x; oy=e.clientY-obj.y;
    el.setPointerCapture?.(e.pointerId);
    el.classList.add('sel');
    S.stickers.forEach(s=>s!==obj && s.el.classList.remove('sel'));
    Narrator.speakOnTap(obj.name);
  });
  el.addEventListener('pointermove',e=>{
    if(!drag)return;
    moved=Math.max(moved,Math.hypot(e.clientX-sx,e.clientY-sy));
    obj.x=e.clientX-ox; obj.y=e.clientY-oy;
    el.style.left=obj.x+'px'; el.style.top=obj.y+'px';
  });
  el.addEventListener('pointerup',()=>{ drag=false; });
  el.addEventListener('pointerleave',()=>{ drag=false; });
  el.addEventListener('dblclick',e=>{
    e.stopPropagation();
    if(obj.url && (obj.type==='audio'||obj.type==='video')){
      loadMedia(obj.url,obj.name);
      togglePlay();
    }
  });
}
function handleToolHit(obj,e){
  if(S.tool==='del'){
    Pop.po(obj,e.clientX,e.clientY);
    setTimeout(()=>{
      obj.el.remove();
      S.stickers=S.stickers.filter(s=>s!==obj);
    },250);
  } else if(S.tool==='pop'){
    Pop.po(obj,e.clientX,e.clientY);
  }
}

/* ── joystick ─────────────────────────────────────────── */
const Joy={
  mounted:false,
  mount(){
    if(this.mounted)return; this.mounted=true;
    const j=document.createElement('div');
    j.id='joy';
    j.style.cssText=`position:fixed;left:18px;bottom:calc(44vh + 12px);width:80px;height:80px;
      border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);
      border:1.5px solid rgba(255,255,255,.3);z-index:35;pointer-events:auto;touch-action:none`;
    j.innerHTML=`<div id="joy-s" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,${getComputedStyle(document.documentElement).getPropertyValue('--theme')||'#7ee8fa'});
      box-shadow:0 0 12px var(--theme);pointer-events:none"></div>`;
    document.body.appendChild(j);
    const stick=j.querySelector('#joy-s');
    let drag=false,ox=0,oy=0;
    j.addEventListener('pointerdown',e=>{ drag=true; const r=j.getBoundingClientRect(); ox=r.left+r.width/2; oy=r.top+r.height/2; });
    const mv=(e)=>{
      if(!drag)return;
      const dx=e.clientX-ox, dy=e.clientY-oy, mx=30;
      const len=Math.hypot(dx,dy);
      const nx=len>mx?dx/len*mx:dx, ny=len>mx?dy/len*mx:dy;
      stick.style.transform=`translate(calc(-50% + ${nx}px),calc(-50% + ${ny}px))`;
      if(filterN && gainN && audioCtx){
        const f=400+((nx/mx)+1)/2*3600;
        filterN.frequency.setTargetAtTime(f,audioCtx.currentTime,.08);
        const g=Math.max(0,1-ny/mx)*.5+.5;
        gainN.gain.setTargetAtTime(g,audioCtx.currentTime,.08);
      }
    };
    const up=()=>{ drag=false; stick.style.transform='translate(-50%,-50%)'; };
    window.addEventListener('pointermove',mv);
    window.addEventListener('pointerup',up);
    this._clean=()=>{ j.remove(); window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); };
  },
  unmount(){ if(!this.mounted)return; this._clean?.(); this.mounted=false; }
};

/* ── timeline with red thread ────────────────────────── */
const Timeline={
  addKF(){
    const x=innerWidth/2 + (Math.random()-.5)*300;
    const y=innerHeight/2 + (Math.random()-.5)*200;
    const text=prompt('Keyframe text (spoken when reached):') || '';
    S.keyframes.push({x,y,text,pos:S.keyframes.length*20+10});
    this.draw();
    this.render();
    paper('save');
    toast('Keyframe ✦ added');
  },
  clear(){
    if(!S.keyframes.length)return;
    S.keyframes=[]; this.draw(); this.render(); toast('Timeline cleared');
  },
  draw(){
    const svg=document.getElementById('threads');
    if(!S.keyframes.length){ svg.innerHTML=''; return; }
    const w=svg.clientWidth||innerWidth, h=svg.clientHeight||innerHeight;
    // build red yarn path through all keyframes
    let d='M '+(S.keyframes[0].x/w*1000)+' '+(S.keyframes[0].y/h*1000);
    for(let i=1;i<S.keyframes.length;i++){
      const p0=S.keyframes[i-1], p1=S.keyframes[i];
      const cpx=(p0.x+p1.x)/2, cpy=(p0.y+p1.y)/2 - 40;
      d+=` Q ${cpx/w*1000} ${cpy/h*1000} ${p1.x/w*1000} ${p1.y/h*1000}`;
    }
    svg.innerHTML=`
      <path d="${d}" fill="none" stroke="#e0245e" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="8 6" opacity=".9"/>
      <path d="${d}" fill="none" stroke="#fff" stroke-width="1"
        stroke-linecap="round" stroke-dasharray="2 14" opacity=".5"/>
    `;
    svg.setAttribute('viewBox','0 0 1000 1000');
  },
  render(){
    const host=document.getElementById('kf-dots');
    const min=Math.min(0,...S.keyframes.map(k=>k.pos));
    const max=Math.max(100,...S.keyframes.map(k=>k.pos));
    const range=max-min||100;
    host.innerHTML=S.keyframes.map((k,i)=>{
      const p=((k.pos-min)/range)*100;
      return `<div class="kf-dot" style="left:${p}%" data-i="${i}" onclick="Timeline.jump(${i})"></div>`;
    }).join('');
  },
  jump(i){
    const k=S.keyframes[i]; if(!k)return;
    const sc=document.getElementById('scrubber');
    const min=Math.min(0,...S.keyframes.map(k=>k.pos));
    const max=Math.max(100,...S.keyframes.map(k=>k.pos));
    const range=max-min||100;
    sc.value=((k.pos-min)/range)*100;
    this.scrub(+sc.value);
  },
  scrub(v){
    S.playhead=v;
    if(!S.keyframes.length)return;
    const min=Math.min(0,...S.keyframes.map(k=>k.pos));
    const max=Math.max(100,...S.keyframes.map(k=>k.pos));
    const target=min+(v/100)*(max-min);
    // speak nearest keyframe
    let best=S.keyframes[0], d=Infinity;
    for(const k of S.keyframes){
      const dist=Math.abs(k.pos-target);
      if(dist<d){ d=dist; best=k; }
    }
    if(d<15 && best.text && S.lastKF!==best){
      S.lastKF=best;
      Narrator.speak(best.text);
      Paulis.say('✦ '+best.text,3200);
    }
  },
  play(){
    togglePlay();
  },
  loop(){
    if(S.tlPlaying){ /* future: drive scrubber */ }
    requestAnimationFrame(()=>this.loop());
  }
};
document.getElementById('scrubber').addEventListener('input',e=>Timeline.scrub(+e.target.value));

/* ── paper sound ─────────────────────────────────────── */
let _pc=null;
function paper(type='paper'){
  try{
    if(!_pc){ _pc=new (window.AudioContext||window.webkitAudioContext)(); }
    if(_pc.state==='suspended') _pc.resume();
    const t=_pc.currentTime;
    const g=_pc.createGain();
    const f=_pc.createBiquadFilter();
    f.type='bandpass';
    f.frequency.value = type==='pop'?2400:type==='save'?900:1600;
    f.Q.value=1.8;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.07,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+(type==='pop'?.12:.22));
    const buf=_pc.createBuffer(1,2048,_pc.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=_pc.createBufferSource(); src.buffer=buf;
    src.connect(f); f.connect(g); g.connect(_pc.destination);
    src.start(t); src.stop(t+.25);
  }catch(e){}
}

/* ── render loop ─────────────────────────────────────── */
function loop(){
  requestAnimationFrame(loop);
  let avg=0;
  if(analyser && isPlaying){
    analyser.getByteFrequencyData(audioData);
    let s=0; for(let i=0;i<audioData.length;i++) s+=audioData[i];
    avg=s/audioData.length;
  }
  ctx.fillStyle='#05040b'; ctx.fillRect(0,0,cw,ch);

  // scene overlays
  if(S.scene==='ocean'){
    const g=ctx.createLinearGradient(0,0,0,ch);
    g.addColorStop(0,'#0b1e3a'); g.addColorStop(1,'#02060f');
    ctx.globalAlpha=.32; ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch); ctx.globalAlpha=1;
  } else if(S.scene==='mystic'){
    ctx.strokeStyle='#9ae6b4'; ctx.lineWidth=1.6; ctx.globalAlpha=.22;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      for(let x=0;x<=cw;x+=18){
        const y=ch*.62+Math.sin(x*.011+Date.now()*.0012+i)*30+avg*.2+i*22;
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  } else if(S.scene==='fire'){
    const g=ctx.createRadialGradient(cw/2,ch,10,cw/2,ch,ch*.7);
    g.addColorStop(0,`rgba(251,146,60,${.12+avg/1000})`); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
  } else if(S.scene==='panda'){
    ctx.globalAlpha=.05;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,ch*.5);
    ctx.fillStyle='#000'; ctx.fillRect(0,ch*.5,cw,ch*.5);
    ctx.globalAlpha=1;
  } else {
    const g=ctx.createRadialGradient(cw*.3,ch*.35,10,cw*.3,ch*.35,cw*.7);
    g.addColorStop(0,`rgba(168,85,247,${.10+avg/1400})`); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
  }

  // particles
  ctx.fillStyle=S.theme;
  for(const p of particles){
    p.x+=p.vx+Math.sin(Date.now()*.001+p.ph)*.14+avg*.003;
    p.y+=p.vy*(1+avg*.01);
    if(S.scene==='fire'&&p.y<-10){ p.y=ch+10; p.x=Math.random()*cw; }
    if(S.scene!=='fire'&&p.y>ch+10){ p.y=-10; p.x=Math.random()*cw; }
    if(p.x<-10) p.x=cw+10;
    if(p.x>cw+10) p.x=-10;
    ctx.globalAlpha=p.a*(.6+avg/400);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // audio waveform
  if(isPlaying){
    ctx.beginPath(); ctx.lineWidth=2; ctx.strokeStyle=S.theme;
    ctx.shadowBlur=10; ctx.shadowColor=S.theme;
    const sw=cw/audioData.length;
    let x=0;
    for(let i=0;i<audioData.length;i++){
      const v=audioData[i]/128;
      const y=(v*ch/4)+ch/2;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      x+=sw;
    }
    ctx.stroke(); ctx.shadowBlur=0;
  }

  // audio-reactive border
  const breathe=isPlaying?(audioData[0]/255):(Math.sin(Date.now()*.0007)*.5+.5)*.1;
  ctx.strokeStyle=S.theme; ctx.globalAlpha=.28+breathe*.4;
  ctx.lineWidth=1.4+breathe*3;
  ctx.strokeRect(6,6,cw-12,ch-12);
  ctx.globalAlpha=1;
}
