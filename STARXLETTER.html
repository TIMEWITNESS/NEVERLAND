<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>Paulis Cosmos · X42 · Neo Hsmburg</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff9ecf;--lav:#c9a7ff;--aqua:#7ee8fa;--gold:#ffd98e;--mint:#9ae6b4;--red:#e0245e;
  --theme:#7ee8fa;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#05040b;color:#f4f1ff;
  font-family:Quicksand,system-ui;overscroll-behavior:none;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}

/* background holo grid */
#grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent 0 32px,rgba(168,85,247,.09) 32px 33px),
    repeating-linear-gradient(90deg,transparent 0 32px,rgba(126,232,250,.07) 32px 33px);}
#grid-bg::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(60vw 60vw at 12% 8%, rgba(126,232,250,.16), transparent 65%),
    radial-gradient(60vw 60vw at 88% 92%, rgba(201,167,255,.18), transparent 65%),
    radial-gradient(40vw 40vw at 78% 12%, rgba(255,158,207,.10), transparent 65%),
    radial-gradient(40vw 40vw at 20% 88%, rgba(255,217,142,.08), transparent 65%);}

#sparkles{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#sparkles span{position:absolute;color:#fff;text-shadow:0 0 6px var(--aqua),0 0 12px var(--lav);
  animation:tw 3s ease-in-out infinite,dr 22s linear infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes dr{from{translate:0 0}to{translate:-40px -50px}}

#cosmos{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#field{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#threads{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}

/* ══ TOP MENU STRIP ══════════════════════════════════════ */
#menu{
  position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:6px;right:6px;z-index:40;
  display:flex;flex-direction:column;gap:4px;pointer-events:none;
}
.menu-row{display:flex;gap:4px;pointer-events:auto;justify-content:center;flex-wrap:nowrap;
  overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px}
.menu-row::-webkit-scrollbar{display:none}
.mbtn{
  width:42px;height:42px;flex-shrink:0;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(15,10,26,.78);border:1px solid rgba(255,255,255,.18);
  color:#fff;font-size:10px;font-weight:700;
  transition:transform .15s,background .15s,border-color .15s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  position:relative;padding:3px}
.mbtn:active{transform:scale(.9)}
.mbtn.active{background:rgba(255,217,142,.22);border-color:var(--gold)}
.mbtn .ic{font-size:16px;line-height:1;pointer-events:none}
.mbtn .nm{font-size:5.8px;opacity:.7;margin-top:1px;letter-spacing:.05em;
  text-transform:uppercase;pointer-events:none;font-weight:800}
.mbtn .dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;
  background:var(--red);box-shadow:0 0 6px var(--red);display:none}
.mbtn.has-new .dot{display:block;animation:pu 1.2s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.mbtn .badge{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  font-size:7px;font-weight:800;color:var(--gold);
  background:rgba(10,6,20,.9);padding:1px 5px;border-radius:99px;
  border:1px solid rgba(255,217,142,.4);display:none}
.mbtn.has-badge .badge{display:block}

/* ══ STICKERS ═══════════════════════════════════════════ */
.sticker{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;
  will-change:transform,left,top;transition:box-shadow .25s,filter .3s;
  transform:translate(-50%,-50%)}
.sticker.text{font-size:40px;line-height:1;user-select:none;
  filter:drop-shadow(0 0 12px var(--theme))}
.sticker.img{width:82px;height:82px;border-radius:16px;overflow:hidden;
  border:1.5px solid rgba(255,255,255,.32);
  box-shadow:0 0 18px -3px var(--theme),inset 0 0 20px rgba(255,255,255,.10)}
.sticker.img img,.sticker.img video{width:100%;height:100%;object-fit:cover;display:block}
.sticker.sel{box-shadow:0 0 0 2.5px #fff,0 0 26px 4px var(--theme)}
.sticker.wand{box-shadow:0 0 0 3px var(--gold),0 0 30px 6px var(--gold)}
.sticker.hitbox::before{content:'';position:absolute;inset:-6px;border:1.5px dashed var(--aqua);
  border-radius:inherit;pointer-events:none;opacity:.7;animation:hb 1.6s linear infinite}
@keyframes hb{to{transform:rotate(360deg)}}
.sticker .desc{position:absolute;top:100%;left:50%;transform:translateX(-50%);
  margin-top:4px;font-size:9.5px;font-weight:700;letter-spacing:.03em;color:#fff;
  background:rgba(10,6,20,.9);padding:3px 8px;border-radius:99px;white-space:nowrap;
  max-width:140px;overflow:hidden;text-overflow:ellipsis;
  border:1px solid rgba(255,255,255,.18);pointer-events:none;display:none}
.sticker .desc.on{display:block}
.wave{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;
  background:radial-gradient(circle at 35% 30%,rgba(201,167,255,.35),rgba(20,10,40,.9))}
.wave span{width:2.5px;border-radius:2px;
  background:linear-gradient(to top,var(--aqua),#fff);
  animation:wv 1.2s ease-in-out infinite}
@keyframes wv{0%,100%{height:14%}50%{height:70%}}

.pop-g{position:absolute;pointer-events:none;font-size:15px;z-index:8;
  animation:popG .85s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes popG{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5) rotate(var(--rot))}}

/* ══ PETS / GODS / RABBIT ═══════════════════════════════ */
.pet{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;
  filter:drop-shadow(0 0 10px rgba(168,85,247,.75));z-index:7}
.pet svg{width:100%;height:100%;overflow:visible}
.pet .aura{animation:ap 4.4s ease-in-out infinite;transform-origin:center}
@keyframes ap{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.1)}}
.pet .tail{transform-origin:76% 62%;animation:tw1 3.6s ease-in-out infinite}
@keyframes tw1{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
.pet .eye{animation:bl 5.8s infinite;transform-origin:center}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.cat-star{position:absolute;width:16px;height:16px;cursor:pointer;pointer-events:auto;
  touch-action:manipulation;z-index:9;transition:transform .2s;
  filter:drop-shadow(0 0 6px var(--gold))}
.cat-star:active{transform:scale(.8) rotate(72deg)}
.cat-star svg{width:100%;height:100%;fill:var(--gold)}
.cat-star.chosen{animation:starPulse 1.2s ease-in-out infinite}
@keyframes starPulse{0%,100%{filter:drop-shadow(0 0 6px var(--gold))}
  50%{filter:drop-shadow(0 0 14px var(--red)) drop-shadow(0 0 20px var(--gold))}}

.god-f{position:absolute;width:42px;height:42px;cursor:pointer;pointer-events:auto;
  touch-action:manipulation;z-index:8;transition:transform .2s;
  filter:drop-shadow(0 0 8px var(--gc,#c9a7ff))}
.god-f:active{transform:scale(.88)}
.god-f svg{width:100%;height:100%}
.god-f .lbl{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
  font-size:5.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;white-space:nowrap;text-shadow:0 0 5px var(--gc,#c9a7ff);pointer-events:none}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-8px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,6px)}}

#rabbit{position:absolute;width:44px;height:44px;pointer-events:auto;cursor:pointer;
  touch-action:manipulation;z-index:9;filter:drop-shadow(0 0 8px var(--pink))}
#rabbit svg{width:100%;height:100%}
#rabbit .wand{position:absolute;right:-14px;top:-8px;font-size:16px;
  filter:drop-shadow(0 0 8px var(--gold));transition:transform .3s}
#rabbit.wand-on .wand{transform:rotate(-25deg) scale(1.3)}

/* ══ MINI CIRCULAR HUD ══════════════════════════════════ */
#mini-hud{position:fixed;z-index:28;pointer-events:none;width:0;height:0;display:none}
#mini-hud.on{display:block}
.mini-b{position:absolute;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;pointer-events:auto;
  background:rgba(15,10,26,.92);border:1.5px solid rgba(255,255,255,.35);
  color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 0 12px -2px var(--theme);
  transition:transform .15s,background .15s}
.mini-b:active{transform:scale(.85)}
.mini-b:hover{background:rgba(255,217,142,.25);border-color:var(--gold)}
.mini-b .tip{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  font-size:6.5px;font-weight:800;letter-spacing:.08em;color:#fff;
  white-space:nowrap;text-shadow:0 0 4px #000;pointer-events:none}

/* ══ LETTER ═════════════════════════════════════════════ */
#letter{position:fixed;left:0;right:0;bottom:0;z-index:12;
  height:44vh;background:linear-gradient(150deg,rgba(168,85,247,.18),rgba(126,232,250,.05));
  transition:height .45s cubic-bezier(.22,1,.36,1),opacity .3s,transform .35s;
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
  touch-action:pan-y;transform:translateY(calc(100% - 44vh))}
#letter::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent 0 32px,rgba(168,85,247,.10) 32px 33px),
    repeating-linear-gradient(90deg,transparent 0 32px,rgba(126,232,250,.07) 32px 33px);
  opacity:.75}
#letter.up{transform:translateY(0)}
#letter.big{height:100vh;transform:translateY(0);padding-top:env(safe-area-inset-top)}
#letter.hidden-bg{transform:translateY(calc(100% - 4px));opacity:.35}
#letter .grip{position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  width:44px;height:4px;border-radius:4px;
  background:rgba(255,255,255,.35);cursor:pointer;pointer-events:auto;touch-action:manipulation;
  box-shadow:0 0 12px var(--lav);margin-top:-2px}
#letter-text{flex:1;width:100%;background:transparent;border:0;outline:none;resize:none;
  color:#fff;font-family:Quicksand;font-size:14px;line-height:1.55;
  padding:12px 18px;position:relative;z-index:1;pointer-events:auto;touch-action:pan-y}
#letter-text::placeholder{color:rgba(201,167,255,.55)}
#letter-tools{position:relative;z-index:1;padding:0 10px 6px;display:flex;gap:4px;
  flex-wrap:wrap;flex-shrink:0}
.lt-b{padding:5px 8px;border-radius:8px;font-size:9px;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:#fff;pointer-events:auto;touch-action:manipulation;
  display:inline-flex;align-items:center;gap:3px;transition:transform .15s}
.lt-b:active{transform:scale(.94)}
.lt-b.primary{background:linear-gradient(120deg,var(--lav),var(--pink));color:#0b0616;
  border-color:transparent}

/* ══ GAMING HUD (toggleable) ═══════════════════════════ */
#game-hud{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  padding:0 12px calc(8px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-between;align-items:flex-end;
  min-height:180px;opacity:0;transform:translateY(20px);
  transition:opacity .35s,transform .35s}
#game-hud.on{opacity:1;transform:translateY(0)}
#game-hud .col{pointer-events:auto;display:flex;flex-direction:column;gap:8px;align-items:center}

/* ══ RAINBOW MIXPUT (the joy) ═══════════════════════════ */
.mixput{
  width:112px;height:112px;position:relative;pointer-events:auto;touch-action:none;
  border-radius:50%;
  background:conic-gradient(from 0deg,
    #ff5c8a, #ffb84d, #ffe870, #9ae6b4, #7ee8fa, #a855f7, #ff9ecf, #ff5c8a);
  box-shadow:
    0 0 22px rgba(255,158,207,.35),
    0 0 42px rgba(126,232,250,.22),
    inset 0 0 20px rgba(0,0,0,.5);
  padding:5px;
}
.mixput::before{content:'';position:absolute;inset:5px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(20,10,40,.98) 40%, rgba(35,20,60,.9) 70%, rgba(15,10,30,.98));
  box-shadow:inset 0 0 24px rgba(0,0,0,.75);
  animation:rotGlow 8s linear infinite}
@keyframes rotGlow{to{transform:rotate(360deg)}}
.mixput .label{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-size:6.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:#fff;text-shadow:0 0 6px rgba(255,255,255,.6);z-index:3;pointer-events:none;
  opacity:.85}
.mixput .ring{position:absolute;inset:14px;border-radius:50%;
  border:1.5px dashed rgba(255,255,255,.22);pointer-events:none;
  animation:spin 12s linear infinite}
.mixput .ring2{position:absolute;inset:26px;border-radius:50%;
  border:1px solid rgba(255,217,142,.22);pointer-events:none;
  animation:spin 22s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.mixput .stick{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 32% 28%,#fff 5%,var(--lav) 45%,#7c3aed 90%);
  box-shadow:
    0 0 16px rgba(201,167,255,.75),
    0 0 28px rgba(168,85,247,.45),
    inset 0 0 6px rgba(0,0,0,.4);
  pointer-events:none;transition:transform .05s linear;
  display:grid;place-items:center}
.mixput .stick::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,rgba(255,217,142,.7));
  box-shadow:0 0 8px var(--gold)}
.mixput .needle{
  position:absolute;left:50%;top:50%;width:2px;height:52%;
  background:linear-gradient(to top,rgba(255,255,255,.8),transparent);
  transform-origin:50% 100%;pointer-events:none;opacity:.35;z-index:1;
  transition:transform .1s}
.mixput .readout{
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  font-size:6.5px;font-weight:800;letter-spacing:.08em;
  color:var(--gold);text-shadow:0 0 6px var(--gold);z-index:3;pointer-events:none;
  background:rgba(0,0,0,.5);padding:1.5px 6px;border-radius:99px;
  border:1px solid rgba(255,217,142,.3)}

/* D-pad */
.dpad{width:88px;height:88px;position:relative;pointer-events:auto;touch-action:none}
.dpad .key{position:absolute;width:28px;height:28px;
  background:rgba(15,10,26,.9);border:1.5px solid rgba(255,255,255,.28);
  display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;
  cursor:pointer;transition:transform .12s,background .12s}
.dpad .key:active,.dpad .key.on{background:rgba(255,217,142,.28);border-color:var(--gold);
  transform:scale(.9)}
.dpad .up{left:30px;top:0;border-radius:8px 8px 0 0}
.dpad .dn{left:30px;top:60px;border-radius:0 0 8px 8px}
.dpad .lf{left:0;top:30px;border-radius:8px 0 0 8px}
.dpad .rt{left:60px;top:30px;border-radius:0 8px 8px 0}
.dpad .mid{left:30px;top:30px;border-radius:0;background:rgba(15,10,26,.95);
  font-size:8px;letter-spacing:.06em;font-weight:800}

/* A/B/X/Y diamond */
.actions{width:118px;height:118px;position:relative;pointer-events:auto;touch-action:none}
.act{position:absolute;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;color:#fff;font-weight:800;
  font-family:Fredoka;font-size:15px;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.22),rgba(20,14,34,.92));
  border:2px solid rgba(255,255,255,.3);
  box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .12s,background .12s,border-color .12s}
.act:active{transform:scale(.88)}
.act.on{background:rgba(255,217,142,.28);border-color:var(--gold);
  box-shadow:0 0 22px 2px var(--gold)}
.act.a{bottom:0;right:6px;background:radial-gradient(circle at 32% 28%,rgba(255,158,207,.35),rgba(60,10,40,.92))}
.act.b{bottom:0;left:6px;background:radial-gradient(circle at 32% 28%,rgba(126,232,250,.35),rgba(10,30,50,.92))}
.act.x{top:0;right:6px;background:radial-gradient(circle at 32% 28%,rgba(154,230,180,.35),rgba(10,40,20,.92))}
.act.y{top:0;left:6px;background:radial-gradient(circle at 32% 28%,rgba(255,217,142,.35),rgba(50,30,10,.92))}
.act .sub{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);
  font-size:6.5px;font-weight:800;letter-spacing:.1em;color:#fff;
  text-transform:uppercase;white-space:nowrap;text-shadow:0 0 4px #000;pointer-events:none}

/* ══ TOAST / SAYS / NARRATOR / WEBCAM ═══════════════════ */
#toast{position:fixed;left:50%;bottom:calc(46vh + 12px);transform:translate(-50%,12px);
  z-index:60;padding:8px 16px;border-radius:99px;font-weight:700;font-size:11.5px;
  color:#0b0616;background:linear-gradient(120deg,var(--aqua),var(--lav),var(--pink));
  opacity:0;pointer-events:none;transition:opacity .24s,transform .24s;
  max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.says{position:fixed;z-index:65;max-width:220px;padding:9px 13px;
  border-radius:14px 14px 14px 3px;
  background:linear-gradient(150deg,var(--lav),var(--pink));
  color:#10061e;font-weight:700;font-size:11.5px;line-height:1.4;
  box-shadow:0 6px 20px rgba(168,85,247,.4);
  animation:pop .28s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
#narrator-p{position:fixed;left:50%;bottom:calc(46vh + 8px);transform:translateX(-50%);
  z-index:55;padding:8px 10px;border-radius:12px;
  background:rgba(26,20,44,.95);border:1px solid rgba(255,255,255,.2);
  display:none;flex-direction:column;gap:4px;min-width:220px;max-width:92vw}
#narrator-p.on{display:flex}
#narrator-p .head{font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;color:var(--gold);text-align:center;margin-bottom:2px}
#narrator-p button{padding:6px 8px;border-radius:8px;cursor:pointer;font-size:10.5px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  color:#fff;text-align:left;display:flex;align-items:center;gap:6px;
  font-family:Quicksand;font-weight:600}
#narrator-p button.on{background:rgba(255,217,142,.2);border-color:var(--gold)}
#webcam{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:16px;
  background:rgba(4,3,10,.9);backdrop-filter:blur(6px)}
#webcam.on{display:grid}
.wm{background:rgba(26,20,44,.98);border:1px solid rgba(255,255,255,.22);
  border-radius:16px;padding:10px;width:100%;max-width:340px;position:relative;
  display:flex;flex-direction:column;gap:8px}
.wm video{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;
  background:#000;transform:scaleX(-1)}
.wm .close{position:absolute;top:-8px;right:-8px;width:26px;height:26px;
  border-radius:50%;background:#e0245e;color:#fff;border:1px solid #fff;
  display:grid;place-items:center;cursor:pointer;font-size:11px}
.wm .cap{padding:9px;border-radius:10px;cursor:pointer;
  background:linear-gradient(120deg,var(--aqua),var(--lav));
  color:#0b0616;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:11px;border:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media (max-width:400px){
  .mbtn{width:38px;height:38px}
  .mbtn .ic{font-size:14px}
  .dpad,.mixput{width:96px;height:96px}
  .dpad .up,.dpad .dn,.dpad .lf,.dpad .rt{width:26px;height:26px}
  .dpad .up{left:26px} .dpad .dn{left:26px;top:52px} .dpad .lf{top:26px} .dpad .rt{left:52px;top:26px}
  .dpad .mid{left:26px;top:26px}
  .actions{width:104px;height:104px}
  .act{width:42px;height:42px;font-size:13px}
}
</style>
</head>
<body>

<div id="grid-bg"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   PAULIS COSMOS · v7 · Menu + Rainbow Mixput + Gaming HUD toggle
   ══════════════════════════════════════════════════════════════════════ */

const S={
  scene:'space', theme:'#7ee8fa', cipher:'norbinny',
  stickers:[], connections:[],
  playerChar:null, activeLayer:3, selected:null,
  wandActive:false, hitboxMode:false, connectMode:null
};

/* sparkles */
(function(){
  const C=['✦','✧','⋆','✫','✬','✭','✮','✯'];
  const host=document.getElementById('sparkles');
  let h=''; const N=innerWidth<520?20:32;
  for(let i=0;i<N;i++){
    h+=`<span style="left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${8+Math.random()*8}px;animation-delay:${(Math.random()*6).toFixed(2)}s,${(Math.random()*6).toFixed(2)}s;animation-duration:${(2.4+Math.random()*3).toFixed(2)}s,${(18+Math.random()*18)|0}s">${C[Math.random()*C.length|0]}</span>`;
  }
  host.innerHTML=h;
})();

/* canvas */
const canvas=document.getElementById('cosmos');
const ctx=canvas.getContext('2d');
let cw,ch,audioData=new Uint8Array(64),particles=[];
function resize(){ cw=canvas.width=innerWidth; ch=canvas.height=innerHeight; initParts(); }
function initParts(){
  particles=[];
  const n=S.scene==='cyber'?80:S.scene==='ocean'?28:50;
  for(let i=0;i<n;i++) particles.push({
    x:Math.random()*cw,y:Math.random()*ch,r:Math.random()*2+.4,
    vy:(Math.random()*.5+.12)*(S.scene==='fire'?-1:1),
    vx:(Math.random()-.5)*.25,
    a:Math.random()*.55+.35,ph:Math.random()*Math.PI*2
  });
}

/* audio */
let audioCtx,audioEl,srcNode,gainN,filterN,delayN,fbN,analyser;
let isPlaying=false;
function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  audioCtx=new AC(); audioCtx.resume();
  audioEl=new Audio(); audioEl.crossOrigin='anonymous';
  analyser=audioCtx.createAnalyser(); analyser.fftSize=128;
  gainN=audioCtx.createGain();
  filterN=audioCtx.createBiquadFilter();
  delayN=audioCtx.createDelay(5);
  fbN=audioCtx.createGain();
  srcNode=audioCtx.createMediaElementSource(audioEl);
  srcNode.connect(filterN); filterN.connect(gainN);
  filterN.connect(delayN); delayN.connect(fbN); fbN.connect(delayN);
  delayN.connect(gainN); gainN.connect(analyser); analyser.connect(audioCtx.destination);
  audioEl.addEventListener('play',()=>isPlaying=true);
  audioEl.addEventListener('pause',()=>isPlaying=false);
  audioEl.addEventListener('ended',()=>isPlaying=false);
  applyCipher('norbinny');
}
function applyCipher(type){
  S.cipher=type;
  if(!filterN)return;
  const t=audioCtx.currentTime;
  const P={
    norbinny:{t:'peaking',f:1500,q:1,d:.3,fb:.3},
    forest:{t:'lowpass',f:400,q:5,d:.6,fb:.5},
    celestial:{t:'highpass',f:3000,q:2,d:.15,fb:.7},
    majesties:{t:'peaking',f:1000,q:2,d:.75,fb:.6},
    ape:{t:'bandpass',f:800,q:4,d:.05,fb:.8},
    dragon:{t:'lowshelf',f:200,q:1,d:1,fb:.4}
  }[type];
  if(!P)return;
  filterN.type=P.t; filterN.frequency.value=P.f; filterN.Q.value=P.q;
  delayN.delayTime.setTargetAtTime(P.d,t,.1);
  fbN.gain.setTargetAtTime(P.fb,t,.1);
}
function loadMedia(url,name){
  if(!audioEl)return;
  audioEl.src=url; audioEl.load();
  audioEl.play().catch(()=>{});
  toast('♪ '+(name||'audio').slice(0,32));
}

/* upload */
const ACCEPTS={
  music:'audio/*',stories:'.txt,.md,.pdf,.doc,.docx',
  pictures:'image/*,.heic,.heif,.avif',videos:'video/*',
  web:'.html,.htm,.url,.webloc',models:'.glb,.gltf',
  text:'.txt,.md,.json,.csv,.log',files:'*/*'
};
function pickFile(cat){
  const inp=document.getElementById('fileInput');
  inp.accept=ACCEPTS[cat]||'*/*';
  inp.value='';
  inp.onchange=async e=>{
    const fs=e.target.files;
    if(!fs||!fs.length)return;
    toast(`Adding ${fs.length}…`);
    for(const f of fs) await ingest(f);
  };
  inp.click();
}
async function ingest(file){
  const mime=file.type||'', name=file.name||'untitled';
  const ext=(name.split('.').pop()||'').toLowerCase();
  const url=URL.createObjectURL(file);
  let type='file', text='';
  try{
    if(mime.startsWith('image/')||['png','jpg','jpeg','webp','gif','svg','avif','heic','heif'].includes(ext)) type='image';
    else if(mime.startsWith('video/')||['mp4','mov','m4v','webm','ogv','avi','mkv'].includes(ext)) type='video';
    else if(mime.startsWith('audio/')||['mp3','m4a','wav','ogg','flac','aac','opus'].includes(ext)) type='audio';
    else if(mime==='application/pdf'||ext==='pdf') type='pdf';
    else if(['glb','gltf'].includes(ext)) type='model';
    else if(['html','htm','url','webloc'].includes(ext)||mime==='text/html') type='web';
    else if(mime.startsWith('text/')||['txt','md','json','csv','log','rtf'].includes(ext)){
      type='note'; text=(await file.text()).slice(0,5000);
    }
  }catch(e){}
  spawnSticker({type,name,url,text});
  paper('save');
}

/* sticker with full previews */
function spawnSticker(item){
  const el=document.createElement('div');
  el.className='sticker';
  const isBig=['image','video','pdf','web','model','audio'].includes(item.type);
  el.classList.add(isBig?'img':'text');
  let innerHTML='';
  switch(item.type){
    case 'image': innerHTML=`<img src="${item.url}" alt="">`; break;
    case 'video': innerHTML=`<video src="${item.url}" muted autoplay loop playsinline></video>`; break;
    case 'audio':{
      const bars=Array.from({length:8},(_,i)=>
        `<span style="animation-delay:${(i*.12).toFixed(2)}s"></span>`).join('');
      innerHTML=`<div class="wave">${bars}</div>`;
      break;
    }
    case 'pdf': innerHTML=`<div style="display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(150deg,rgba(255,158,207,.35),rgba(60,10,40,.9));font-size:26px">📕</div>`; break;
    case 'web': innerHTML=`<div style="display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(150deg,rgba(154,230,180,.32),rgba(10,40,25,.9));font-size:26px">🌐</div>`; break;
    case 'model': innerHTML=`<div style="display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(150deg,rgba(183,148,244,.32),rgba(30,15,55,.9));font-size:26px">🧊</div>`; break;
    case 'note': innerHTML=`<div style="display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(150deg,rgba(255,217,142,.32),rgba(60,40,10,.85));font-size:26px">📜</div>`; break;
    default: innerHTML=`<span style="font-size:30px">📦</span>`;
  }
  el.innerHTML=innerHTML;

  const x=80+Math.random()*(innerWidth-200);
  const y=200+Math.random()*(innerHeight*0.35-100);
  el.style.left=x+'px'; el.style.top=y+'px';
  el.style.zIndex='5';

  const obj={
    id:'s'+Date.now()+Math.random(),
    el, type:item.type, name:item.name,
    x, y, vx:0, vy:0, layer:3,
    rotation:0, scale:1, scaleX:1, scaleY:1,
    url:item.url, text:item.text, description:'', hitbox:false
  };
  S.stickers.push(obj);
  document.getElementById('field').appendChild(el);
  attachStickerEvents(obj);
  toast('Added ✦');
}

/* physics */
let _lastT=performance.now();
function physicsTick(now){
  requestAnimationFrame(physicsTick);
  const dt=Math.min((now-_lastT)/16.67,2);
  _lastT=now;
  const avg = isPlaying ? audioData.reduce((a,b)=>a+b,0)/audioData.length : 0;
  const t=now*.001;
  for(const s of S.stickers){
    if(s.dragging) continue;
    s.vx *= 0.985; s.vy *= 0.985;
    s.x += s.vx*dt + Math.sin(t*.4 + s.x*.01)*0.06*dt;
    s.y += s.vy*dt + Math.cos(t*.5 + s.y*.01)*0.05*dt;
    const pad = 40;
    if(s.x < pad){ s.x = pad; s.vx = Math.abs(s.vx)*.6; }
    if(s.x > innerWidth-pad){ s.x = innerWidth-pad; s.vx = -Math.abs(s.vx)*.6; }
    if(s.y < pad+120){ s.y = pad+120; s.vy = Math.abs(s.vy)*.6; }
    if(s.y > innerHeight*0.55){ s.y = innerHeight*0.55; s.vy = -Math.abs(s.vy)*.6; }
    s.el.style.left = s.x+'px';
    s.el.style.top = s.y+'px';
    const rot = s.rotation + Math.sin(t*.3 + s.id.length)*.4;
    const swell = 1 + avg/2550;
    const sc = s.scale * swell;
    s.el.style.transform = `translate(-50%,-50%) rotate(${rot}deg) scale(${sc*s.scaleX},${sc*s.scaleY})`;
  }
  if(S.selected) positionMiniHud(S.selected);
  updateThreads();
}

/* sticker events */
function attachStickerEvents(obj){
  const el=obj.el;
  let drag=false, sx=0, sy=0, ox=0, oy=0, moved=0;
  let pinchStart=0, pinchRotation=0;
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    if(S.hitboxMode && obj.hitbox){ toast('Hitbox: '+obj.name); return; }
    if(S.connectMode){ Connect.pick(obj); return; }
    el.setPointerCapture?.(e.pointerId);
    el._ptrs = el._ptrs || new Set();
    el._ptrs.add(e.pointerId);
    if(el._ptrs.size === 1){
      drag=true; moved=0;
      sx=e.clientX; sy=e.clientY;
      const r=el.getBoundingClientRect();
      ox=e.clientX - (r.left+r.width/2);
      oy=e.clientY - (r.top+r.height/2);
      obj.x = r.left+r.width/2;
      obj.y = r.top+r.height/2;
      select(obj);
    } else if(el._ptrs.size === 2){
      drag=false;
      const ids=[...el._ptrs];
      const a=el._cache?.get(ids[0]), b=el._cache?.get(ids[1]);
      if(a && b){
        pinchStart = Math.hypot(a.x-b.x, a.y-b.y);
        pinchRotation = Math.atan2(b.y-a.y, b.x-a.x);
        obj._sScale = obj.scale;
        obj._sRot = obj.rotation;
      }
    }
    el._cache = el._cache || new Map();
    el._cache.set(e.pointerId, {x:e.clientX, y:e.clientY});
  });
  el.addEventListener('pointermove',e=>{
    if(!el._ptrs)return;
    el._cache = el._cache || new Map();
    el._cache.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(el._ptrs.size === 1 && drag){
      moved=Math.max(moved, Math.hypot(e.clientX-sx, e.clientY-sy));
      obj.x = e.clientX - ox;
      obj.y = e.clientY - oy;
      obj.vx = (e.movementX||0)*0.3;
      obj.vy = (e.movementY||0)*0.3;
    } else if(el._ptrs.size === 2){
      const ids=[...el._ptrs];
      const a=el._cache.get(ids[0]), b=el._cache.get(ids[1]);
      if(!a||!b)return;
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      const angle = Math.atan2(b.y-a.y, b.x-a.x);
      if(pinchStart>0){
        obj.scale = Math.max(0.3, Math.min(3, obj._sScale * (dist/pinchStart)));
        obj.rotation = obj._sRot + (angle - pinchRotation)*180/Math.PI;
      }
    }
  });
  const end=e=>{
    el._ptrs?.delete(e.pointerId);
    if(el._ptrs?.size === 0){
      drag=false;
      if(moved < 5 && !S.connectMode && !S.hitboxMode){
        // pass-through: only select on first tap
      }
    }
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('pointerleave',end);
  let lastTap=0;
  el.addEventListener('pointerdown',e=>{
    const now=Date.now();
    if(now-lastTap<300) grabWithWand(obj);
    lastTap=now;
  });
}

/* select + mini HUD */
function select(obj){
  if(!obj){ S.selected=null; hideMiniHud(); return; }
  S.selected=obj;
  S.stickers.forEach(s=>s.el.classList.toggle('sel', s===obj));
  showMiniHud(obj);
  Narrator.speakOnTap(obj.name);
  paper('paper');
}
function showMiniHud(obj){
  const hud=document.getElementById('mini-hud');
  hud.innerHTML='';
  const actions=[
    {tip:'Rot -15°', icon:'↺', fn:()=>{ obj.rotation-=15; }},
    {tip:'Rot +15°', icon:'↻', fn:()=>{ obj.rotation+=15; }},
    {tip:'Scale -',  icon:'−', fn:()=>{ obj.scale=Math.max(.3,obj.scale-.15); }},
    {tip:'Scale +',  icon:'+', fn:()=>{ obj.scale=Math.min(3,obj.scale+.15); }},
    {tip:'Stretch X',icon:'↔', fn:()=>{ obj.scaleX=obj.scaleX===1?1.4:1; }},
    {tip:'Stretch Y',icon:'↕', fn:()=>{ obj.scaleY=obj.scaleY===1?1.4:1; }},
    {tip:'Layer ▲',  icon:'▲', fn:()=>{ obj.layer=Math.min(3,obj.layer+1); updateLayerZ(obj); }},
    {tip:'Layer ▼',  icon:'▼', fn:()=>{ obj.layer=Math.max(0,obj.layer-1); updateLayerZ(obj); }},
    {tip:'Delete',   icon:'✕', fn:()=>{ deleteSticker(obj); }}
  ];
  const R=64;
  actions.forEach((a,i)=>{
    const ang = (i/actions.length)*Math.PI*2 - Math.PI/2;
    const btn=document.createElement('div');
    btn.className='mini-b';
    btn.style.left = (Math.cos(ang)*R - 17)+'px';
    btn.style.top  = (Math.sin(ang)*R - 17)+'px';
    btn.innerHTML = a.icon + `<span class="tip">${a.tip}</span>`;
    btn.addEventListener('click',e=>{ e.stopPropagation(); a.fn(); paper('paper'); });
    hud.appendChild(btn);
  });
  hud.classList.add('on');
  positionMiniHud(obj);
}
function positionMiniHud(obj){
  const hud=document.getElementById('mini-hud');
  hud.style.left = obj.x+'px';
  hud.style.top  = obj.y+'px';
}
function hideMiniHud(){ document.getElementById('mini-hud').classList.remove('on'); }

function grabWithWand(obj){
  S.wandActive=true;
  obj.layer=3;
  updateLayerZ(obj);
  obj.el.classList.add('wand');
  setTimeout(()=>obj.el.classList.remove('wand'),700);
  const rabbit=document.getElementById('rabbit');
  rabbit?.classList.add('wand-on');
  setTimeout(()=>rabbit?.classList.remove('wand-on'),1200);
  toast('✦ Wand · '+obj.name+' lifted');
  Paulis.say('✦ lifted with the wand',2200);
  paper('pop');
}

const LAYER_Z={0:2,1:3,2:4,3:5};
function updateLayerZ(obj){
  obj.el.style.zIndex=LAYER_Z[obj.layer];
  const names=['Sky','Mid Back','Mid Front','Foreground'];
  if(S.selected===obj) document.getElementById('hud-status').textContent='Layer '+obj.layer+' · '+names[obj.layer];
}
function deleteSticker(obj){
  const r=obj.el.getBoundingClientRect();
  Pop.at(r.left+r.width/2, r.top+r.height/2);
  obj.el.remove();
  S.stickers=S.stickers.filter(s=>s!==obj);
  if(S.selected===obj){ S.selected=null; hideMiniHud(); }
  toast('Released ✦');
}

const Pop={
  at(cx,cy){
    paper('pop');
    const hues=['#ffd98e','#ffb84d','#ff9ecf','#ffc46b','#ffe4a8','#e0245e'];
    const chars=['✦','✧','⋆','✫','✬','✭'];
    for(let i=0;i<14;i++){
      const g=document.createElement('div');
      g.className='pop-g';
      g.textContent=chars[i%chars.length];
      g.style.color=hues[i%hues.length];
      g.style.left=cx+'px'; g.style.top=cy+'px';
      g.style.setProperty('--dx',((Math.random()-.5)*110)+'px');
      g.style.setProperty('--dy',((Math.random()-.5)*110)+'px');
      g.style.setProperty('--rot',(Math.random()*360-180)+'deg');
      document.getElementById('field').appendChild(g);
      setTimeout(()=>g.remove(),900);
    }
  }
};

function updateThreads(){
  const svg=document.getElementById('threads');
  const w=svg.clientWidth||innerWidth, h=svg.clientHeight||innerHeight;
  if(!S.connections.length){ svg.innerHTML=''; return; }
  const avg = isPlaying ? audioData.reduce((a,b)=>a+b,0)/audioData.length : 20;
  const thick = 0.5 + avg/300;
  const op = 0.4 + avg/500;
  let paths='';
  for(const c of S.connections){
    const a=c.a, b=c.b;
    if(!a.el.parentElement || !b.el.parentElement) continue;
    const x1=a.x/w*1000, y1=a.y/h*1000;
    const x2=b.x/w*1000, y2=b.y/h*1000;
    const mx=(x1+x2)/2 + Math.sin(Date.now()*.001+c.id)*6;
    const my=(y1+y2)/2 + Math.cos(Date.now()*.0012+c.id)*6;
    paths += `<path d="M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}" fill="none"
      stroke="#e0245e" stroke-width="${thick}" stroke-linecap="round"
      stroke-dasharray="2 4" opacity="${op.toFixed(2)}"/>`;
  }
  svg.innerHTML=paths;
}

/* ══ RAINBOW MIXPUT ═════════════════════════════════════ */
(function(){
  const mp=document.getElementById('mixput');
  const stick=document.getElementById('mp-stick');
  const needle=document.getElementById('mp-needle');
  const readout=document.getElementById('mp-readout');
  let drag=false, ox=0, oy=0;
  const mx=32, R=56;
  mp.addEventListener('pointerdown',e=>{
    drag=true; mp.setPointerCapture?.(e.pointerId);
    const r=mp.getBoundingClientRect();
    ox=r.left+r.width/2; oy=r.top+r.height/2;
  });
  mp.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-ox, dy=e.clientY-oy;
    const len=Math.hypot(dx,dy);
    const nx=len>mx?dx/len*mx:dx;
    const ny=len>mx?dy/len*mx:dy;
    stick.style.transform=`translate(calc(-50% + ${nx}px),calc(-50% + ${ny}px))`;
    const ang = Math.atan2(ny,nx)*180/Math.PI + 90;
    needle.style.transform=`rotate(${ang}deg)`;
    const pctX = ((nx/mx+1)/2*100)|0;
    const pctY = ((1-(ny/mx+1)/2)*100)|0;
    readout.textContent=`X:${pctX} Y:${pctY}`;
    if(filterN && gainN && audioCtx){
      const f=300 + (nx/mx+1)/2 * 4200;
      filterN.frequency.setTargetAtTime(f, audioCtx.currentTime, .06);
      const g = Math.max(0, 1-Math.abs(ny)/mx) * .7 + .3;
      gainN.gain.setTargetAtTime(g, audioCtx.currentTime, .06);
      // rotate the outer rainbow with the angle
      mp.style.filter = `hue-rotate(${ang*.5}deg) drop-shadow(0 0 ${10+pctX/10}px rgba(255,158,207,.5))`;
    }
    // drift selected sticker
    if(S.selected){
      S.selected.vx += nx*0.008;
      S.selected.vy += ny*0.008;
    }
  });
  const end=()=>{
    drag=false;
    stick.style.transform='translate(-50%,-50%)';
    needle.style.transform='rotate(0deg)';
    mp.style.filter='';
    readout.textContent='X:0 Y:0';
  };
  mp.addEventListener('pointerup',end);
  mp.addEventListener('pointercancel',end);
  mp.addEventListener('pointerleave',end);
  // audio-reactive rainbow pulse
  setInterval(()=>{
    if(!isPlaying)return;
    const avg = audioData.reduce((a,b)=>a+b,0)/audioData.length;
    mp.style.boxShadow = `0 0 ${18+avg/6}px rgba(255,158,207,.5),
                          0 0 ${34+avg/4}px rgba(126,232,250,.35),
                          inset 0 0 22px rgba(0,0,0,.5)`;
  }, 80);
})();

function captureWebcam(){
  const v=document.getElementById('webcam-video');

  const c=document.createElement('canvas');
  const size=Math.min(v.videoWidth,v.videoHeight);
  c.width=size; c.height=size;
  const gc=c.getContext('2d');
  gc.translate(size,0); gc.scale(-1,1);

}

  hoverOn:false, voice:null,
  togglePanel(){ document.getElementById('narrator-p').classList.toggle('on'); paper('paper'); },
  pickVoice(){
    const vs=speechSynthesis.getVoices();
    if(!vs.length){ toast('No voices yet'); return; }
    const n=parseInt(prompt(vs.map((v,i)=>`${i+1}. ${v.name}`).join('\n')));
    if(n>=1&&n<=vs.length){ this.voice=vs[n-1]; toast('Voice: '+this.voice.name); }
  },
  speak(text){
    if(!('speechSynthesis' in window))return;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.rate=.94; u.pitch=1.2;
      if(this.voice) u.voice=this.voice;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  readLetter(){
    const t=document.getElementById('letter-text').value.trim();
    if(!t){ toast('Letter empty'); return; }
    this.speak(t);
  },
  toggleHover(){
    this.hoverOn=!this.hoverOn;
    document.getElementById('narr-hover').classList.toggle('on',this.hoverOn);
    toast(this.hoverOn?'Narrate taps: ON':'Narrate taps: OFF');
  },
  speakOnTap(text){ if(this.hoverOn && text) this.speak(text); },
  stop(){ if('speechSynthesis' in window) speechSynthesis.cancel(); },
  chooseChar(id){
    S.playerChar = (S.playerChar===id) ? null : id;
    document.querySelectorAll('.cat-star').forEach(s=>s.classList.toggle('chosen', s.dataset.char===S.playerChar));
    if(S.playerChar){ toast('Playing as '+id); this.speak('You are now '+id); paper('pop'); }
  }
};

/* paper sound */
let _pc=null;
function paper(type='paper'){
  try{
    if(!_pc) _pc=new (window.AudioContext||window.webkitAudioContext)();
    if(_pc.state==='suspended') _pc.resume();
    const t=_pc.currentTime;
    const g=_pc.createGain();
    const f=_pc.createBiquadFilter();
    f.type='bandpass';
    f.frequency.value=type==='pop'?2400:type==='save'?900:1600;
    f.Q.value=1.8;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.07,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+(type==='pop'?.12:.22));
    const buf=_pc.createBuffer(1,2048,_pc.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=_pc.createBufferSource(); src.buffer=buf;
    src.connect(f); f.connect(g); g.connect(_pc.destination);
    src.start(t); src.stop(t+.25);
  }catch(e){}
}

/* toast + says */
let _tt=null;
function toast(msg,ms=2200){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(_tt);
  _tt=setTimeout(()=>el.classList.remove('on'),ms);
}
const Paulis={
  sayEl:null, timer:null,
  say(text,ms=3400){
    if(!text)return; this.hide();
    const d=document.createElement('div');
    d.className='says'; d.textContent=text;
    document.body.appendChild(d); this.sayEl=d;
    const pet=document.getElementById('paulis');
    if(pet){
      const r=pet.getBoundingClientRect();
      let left=r.left-210;
      if(left<8) left=Math.min(r.right+8,innerWidth-220);
      let top=Math.max(140,Math.min(r.top-10,innerHeight-100));
      d.style.left=left+'px'; d.style.top=top+'px';
    } else { d.style.left='20%'; d.style.top='30%'; }
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>this.hide(),ms);
  },
  hide(){
    if(this.sayEl){
      const s=this.sayEl;
      s.style.transition='opacity .25s'; s.style.opacity='0';
      setTimeout(()=>s.remove(),260); this.sayEl=null;
    }
  }
};

/* render loop */
function loop(){
  requestAnimationFrame(loop);
  if(!analyser)return;
  if(isPlaying) analyser.getByteFrequencyData(audioData);
  let avg=0;
  for(let i=0;i<audioData.length;i++) avg+=audioData[i];
  avg/=audioData.length;

  ctx.fillStyle='#05040b'; ctx.fillRect(0,0,cw,ch);
  if(S.scene==='ocean'){
    const g=ctx.createLinearGradient(0,0,0,ch);
    g.addColorStop(0,'#0b1e3a'); g.addColorStop(1,'#02060f');
    ctx.globalAlpha=.34; ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch); ctx.globalAlpha=1;
  } else if(S.scene==='mystic'){
    ctx.strokeStyle='#9ae6b4'; ctx.lineWidth=1.4; ctx.globalAlpha=.20;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      for(let x=0;x<=cw;x+=18){
        const y=ch*.62+Math.sin(x*.011+Date.now()*.0012+i)*30+avg*.2+i*22;
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  } else if(S.scene==='fire'){
    const g=ctx.createRadialGradient(cw/2,ch,10,cw/2,ch,ch*.7);
    g.addColorStop(0,`rgba(251,146,60,${.12+avg/1000})`); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
  } else if(S.scene==='panda'){
    ctx.globalAlpha=.05;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,ch*.5);
    ctx.fillStyle='#000'; ctx.fillRect(0,ch*.5,cw,ch*.5);
    ctx.globalAlpha=1;
  } else {
    const g=ctx.createRadialGradient(cw*.3,ch*.35,10,cw*.3,ch*.35,cw*.7);
    g.addColorStop(0,`rgba(168,85,247,${.10+avg/1400})`); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
  }
  ctx.fillStyle=S.theme;
  for(const p of particles){
    p.x+=p.vx+Math.sin(Date.now()*.001+p.ph)*.14+avg*.003;
    p.y+=p.vy*(1+avg*.01);
    if(S.scene==='fire'&&p.y<-10){ p.y=ch+10; p.x=Math.random()*cw; }
    if(S.scene!=='fire'&&p.y>ch+10){ p.y=-10; p.x=Math.random()*cw; }
    if(p.x<-10) p.x=cw+10;
    if(p.x>cw+10) p.x=-10;
    ctx.globalAlpha=p.a*(.6+avg/400);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  if(isPlaying){
    ctx.beginPath(); ctx.lineWidth=1.6; ctx.strokeStyle=S.theme;
    ctx.shadowBlur=10; ctx.shadowColor=S.theme;
    const sw=cw/audioData.length;
    let x=0;
    for(let i=0;i<audioData.length;i++){
      const v=audioData[i]/128;
      const y=(v*ch/4)+ch/2;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      x+=sw;
    }
    ctx.stroke(); ctx.shadowBlur=0;
  }
}
